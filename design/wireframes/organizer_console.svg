<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1440" height="950" rx="0" fill="#F3F1EA"/><rect x="0" y="0" width="220" height="950" rx="0" fill="#493B2D"/><text x="26" y="56" font-size="24" fill="#FFF8E9" font-weight="700" text-anchor="start">羊年游园会</text><text x="26" y="88" font-size="15" fill="#D8CFBC" font-weight="400" text-anchor="start">主办方控制台</text><rect x="12" y="119" width="196" height="48" rx="12" fill="#74634D"/><text x="28" y="150" font-size="18" fill="#FFF8E9" font-weight="400" text-anchor="start">活动概览</text><text x="28" y="212" font-size="18" fill="#FFF8E9" font-weight="400" text-anchor="start">名单与身份</text><text x="28" y="274" font-size="18" fill="#FFF8E9" font-weight="400" text-anchor="start">阶段与配置</text><text x="28" y="336" font-size="18" fill="#FFF8E9" font-weight="400" text-anchor="start">复核与原槽补场</text><text x="28" y="398" font-size="18" fill="#FFF8E9" font-weight="400" text-anchor="start">礼品库存</text><text x="28" y="460" font-size="18" fill="#FFF8E9" font-weight="400" text-anchor="start">订单与审计</text><text x="28" y="522" font-size="18" fill="#FFF8E9" font-weight="400" text-anchor="start">数据导出</text><text x="26" y="908" font-size="14" fill="#D8CFBC" font-weight="400" text-anchor="start">仅限授权工作人员</text><text x="254" y="55" font-size="28" fill="#493B2D" font-weight="700" text-anchor="start">活动概览</text><text x="254" y="88" font-size="16" fill="#766B5B" font-weight="400" text-anchor="start">状态线框示意；不代表实际活动已配置或通过验收。</text><rect x="254" y="112" width="1154" height="122" rx="16" fill="#FFF8E9"/><text x="279" y="149" font-size="24" fill="#493B2D" font-weight="700" text-anchor="start">当前阶段  DRAINING  收尾核验</text><text x="279" y="184" font-size="17" fill="#766B5B" font-weight="400" text-anchor="start">普通挑战入口已关闭；原在途局按原截止完成</text><text x="279" y="212" font-size="16" fill="#766B5B" font-weight="400" text-anchor="start">新开局开关：开启   ·   仅允许有效原槽授权按自身截止补场</text><rect x="1112" y="146" width="272" height="52" rx="20" fill="#8A8275"/><text x="1248.0" y="179" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">封榜条件未齐</text><rect x="254" y="254" width="374" height="94" rx="16" fill="#FFF8E9"/><text x="276" y="285" font-size="17" fill="#493B2D" font-weight="400" text-anchor="start">预约 / 运行 / 待上传</text><text x="276" y="329" font-size="32" fill="#587C46" font-weight="700" text-anchor="start">0</text><rect x="644" y="254" width="374" height="94" rx="16" fill="#FFF8E9"/><text x="666" y="285" font-size="17" fill="#493B2D" font-weight="400" text-anchor="start">入口受理中</text><text x="666" y="329" font-size="32" fill="#587C46" font-weight="700" text-anchor="start">0</text><rect x="1034" y="254" width="374" height="94" rx="16" fill="#FFF8E9"/><text x="1056" y="285" font-size="17" fill="#493B2D" font-weight="400" text-anchor="start">待核分任务</text><text x="1056" y="329" font-size="32" fill="#587C46" font-weight="700" text-anchor="start">0</text><rect x="254" y="364" width="374" height="94" rx="16" fill="#FFF8E9"/><text x="276" y="395" font-size="17" fill="#493B2D" font-weight="400" text-anchor="start">待人工复核</text><text x="276" y="439" font-size="32" fill="#587C46" font-weight="700" text-anchor="start">0</text><rect x="644" y="364" width="374" height="94" rx="16" fill="#FFF8E9"/><text x="666" y="395" font-size="17" fill="#493B2D" font-weight="400" text-anchor="start">有效未用补场</text><text x="666" y="439" font-size="32" fill="#587C46" font-weight="700" text-anchor="start">0</text><rect x="1034" y="364" width="374" height="94" rx="16" fill="#FFF8E9"/><text x="1056" y="395" font-size="17" fill="#493B2D" font-weight="400" text-anchor="start">恢复审查未完成</text><text x="1056" y="439" font-size="32" fill="#587C46" font-weight="700" text-anchor="start">0</text><text x="254" y="493" font-size="22" fill="#493B2D" font-weight="700" text-anchor="start">封榜条件</text><rect x="254" y="510" width="720" height="230" rx="16" fill="#FFF8E9"/><text x="277" y="548" font-size="17" fill="#493B2D" font-weight="400" text-anchor="start">□  全部局次、完整提交、核分与复核已经明确</text><text x="277" y="597" font-size="17" fill="#493B2D" font-weight="400" text-anchor="start">□  有效未用补场已用完、到期或审计取消</text><text x="277" y="646" font-size="17" fill="#493B2D" font-weight="400" text-anchor="start">□  领取截止已配置，并且晚于当前服务端时间</text><text x="277" y="695" font-size="17" fill="#493B2D" font-weight="400" text-anchor="start">□  发布版本与恢复检查通过；库存与价格已核对</text><rect x="994" y="510" width="414" height="230" rx="16" fill="#FFF8E9"/><text x="1017" y="547" font-size="21" fill="#493B2D" font-weight="700" text-anchor="start">原槽补场</text><text x="1017" y="582" font-size="16" fill="#766B5B" font-weight="400" text-anchor="start">仅向确认系统故障的指定人员授权</text><text x="1017" y="614" font-size="16" fill="#766B5B" font-weight="400" text-anchor="start">PLAYING / DRAINING 均可使用</text><text x="1017" y="646" font-size="16" fill="#766B5B" font-weight="400" text-anchor="start">旧局作废并冲正，不增加第四槽</text><text x="1017" y="678" font-size="16" fill="#766B5B" font-weight="400" text-anchor="start">普通开局不能使用授权保留槽</text><text x="1017" y="710" font-size="16" fill="#B83F2C" font-weight="700" text-anchor="start">封榜后禁止新增和使用补场</text><text x="254" y="785" font-size="22" fill="#493B2D" font-weight="700" text-anchor="start">工作人员操作提示</text><rect x="254" y="806" width="1154" height="94" rx="16" fill="#FFF8E9"/><text x="279" y="842" font-size="18" fill="#493B2D" font-weight="400" text-anchor="start">封榜遇仍可能有效的入口受理时立即提示阻断；处理完成后再次尝试。</text><text x="279" y="878" font-size="18" fill="#493B2D" font-weight="400" text-anchor="start">核销成功后才交实物；重复扫描先查看原领取记录。</text></svg>