 width="358" height="176" rx="12" fill="white" stroke="#7b9182"/><rect x="48" y="867" width="147" height="147" rx="8" fill="#e6eee6"/><text x="88" y="946" font-size="14">方形封面</text><text x="207" y="890" font-size="16" font-weight="bold">赶羊入圈</text><text x="207" y="916" font-size="12">玩法图与真实组件</text><rect x="207" y="967" width="175" height="48" rx="10" fill="#e6eee6"/><text x="225" y="997" font-size="14">真实操作 ≥48高</text><rect x="36" y="1047" width="358" height="64" rx="12" fill="white" stroke="#7b9182"/><text x="52" y="1072" font-size="16" font-weight="bold">积分说明</text><text x="52" y="1095" font-size="12">真实规则；允许换行</text><rect x="20" y="1127" width="390" height="72" rx="12" fill="white" stroke="#7b9182"/><text x="36" y="1152" font-size="16" font-weight="bold">底部导航</text><text x="36" y="1175" font-size="12">固定时预留等高页面空间与安全区</text><text x="20" y="1228" font-size="12">主体宽390、内容宽358；外侧20仅为文档注释边距。</text><text x="20" y="1248" font-size="12">具体以JSON与素材比例为准；图中字小为注释，非产品字号。</text></g></svg>
